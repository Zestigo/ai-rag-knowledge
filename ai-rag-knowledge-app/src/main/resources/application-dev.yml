# 服务器配置
# 配置应用服务的基本信息
server:
  port: 8090  # 应用服务端口，指定服务运行的端口号

# Spring 配置
# 配置 Spring 相关的核心组件
spring:
  # 数据源配置
  # 配置数据库连接信息
  datasource:
    driver-class-name: org.postgresql.Driver  # 数据库驱动类名，使用 PostgreSQL 驱动
    url: jdbc:postgresql://192.168.21.130:5432/ai_rag_knowledge  # PostgreSQL 数据库连接地址
    username: postgres  # 数据库用户名
    password: postgres  # 数据库密码
    type: com.zaxxer.hikari.HikariDataSource  # 数据源类型，使用 Hikari 连接池
  # AI 相关配置
  # 配置 AI 模型和向量存储
  ai:
    # 向量存储配置
    # 配置向量存储的相关参数
    vectorstore:
      pgvector:
        index-type: HNSW  # 索引类型：分层导航小世界图，提高向量搜索效率
        distance-type: COSINE_DISTANCE  # 距离计算类型：余弦距离，用于计算向量相似度
        dimensions: 768  # 向量维度，对应 nomic-embed-text 模型的输出维度
    # Ollama 配置
    # 配置 Ollama 模型服务
    ollama:
      # 统一使用虚拟机的 IP
      base-url: http://192.168.21.130:11434  # Ollama API 基础 URL，指定 Ollama 服务的地址
      # 聊天模型配置
      # 配置聊天模型的参数
      chat:
        options:
          model: deepseek-r1:1.5b  # 聊天模型名称，使用 deepseek-r1 1.5B 模型
          temperature: 0.7  # 温度参数，控制生成的随机性，值越高生成内容越多样
      # 嵌入模型配置
      # 配置嵌入模型的参数
      embedding:
        options:
          model: nomic-embed-text  # 嵌入模型名称，使用 nomic-embed-text 模型生成向量
  # MVC 配置
  # 配置 Spring MVC 相关参数
  mvc:
    # 异步请求配置
    async:
      # 设置异步请求超时时间（单位：毫秒），这里设置为 100,000ms = 100秒
      request-timeout: 100000

# Redis 配置
# 配置 Redis 缓存服务
redis:
  sdk:
    config:
      host: 192.168.21.130  # Redis 主机地址
      port: 16379  # Redis 端口
      pool-size: 10  # 连接池大小，控制最大连接数
      min-idle-size: 5  # 最小空闲连接数，保持连接池中有足够的空闲连接
      idle-timeout: 30000  # 连接最大空闲时间（毫秒），超过此时间的空闲连接将被关闭
      connect-timeout: 5000  # 连接超时时间（毫秒），连接 Redis 服务器的超时时间
      retry-attempts: 3  # 连接重试次数，连接失败时的重试次数
      retry-interval: 1000  # 连接重试间隔（毫秒），两次重试之间的等待时间
      ping-interval: 60000  # 定期检查连接间隔（毫秒），用于检测连接是否有效
      keep-alive: true  # 是否保持长连接，启用后将保持与 Redis 服务器的连接

# 日志配置
# 配置系统日志的相关参数
logging:
  level:
    root: info  # 根日志级别，设置为 info 级别
  config: classpath:logback-spring.xml  # 日志配置文件路径，使用 logback-spring.xml 配置文件
