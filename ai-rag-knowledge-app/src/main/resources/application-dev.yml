# 服务器配置
server:
  port: 8090  # 应用服务端口

# Spring 配置
spring:
  # 数据源配置
  datasource:
    url: jdbc:postgresql://192.168.21.130:5432/springai  # PostgreSQL 数据库连接地址
    username: postgres  # 数据库用户名
    password: postgres  # 数据库密码
  # AI 相关配置
  ai:
    # 向量存储配置
    vectorstore:
      pgvector:
        index-type: HNSW  # 索引类型：分层导航小世界图
        distance-type: COSINE_DISTANCE  # 距离计算类型：余弦距离
        dimensions: 768  # 向量维度，对应 nomic-embed-text 模型
    # Ollama 配置
    ollama:
      # 统一使用虚拟机的 IP
      base-url: http://192.168.21.130:11434  # Ollama API 基础 URL
      # 聊天模型配置
      chat:
        options:
          model: deepseek-r1:1.5b  # 聊天模型名称
          temperature: 0.7  # 温度参数，控制生成的随机性
      # 嵌入模型配置
      embedding:
        options:
          model: nomic-embed-text  # 嵌入模型名称

# Redis 配置
redis:
  sdk:
    config:
      host: 192.168.21.130  # Redis 主机地址
      port: 16379  # Redis 端口
      pool-size: 10  # 连接池大小
      min-idle-size: 5  # 最小空闲连接数
      idle-timeout: 30000  # 连接最大空闲时间（毫秒）
      connect-timeout: 5000  # 连接超时时间（毫秒）
      retry-attempts: 3  # 连接重试次数
      retry-interval: 1000  # 连接重试间隔（毫秒）
      ping-interval: 60000  # 定期检查连接间隔（毫秒）
      keep-alive: true  # 是否保持长连接

# 日志配置
logging:
  level:
    root: info  # 根日志级别
  config: classpath:logback-spring.xml  # 日志配置文件路径
